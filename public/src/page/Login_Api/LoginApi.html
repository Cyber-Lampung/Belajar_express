<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../../css/loginApi.css" />
    <title>Login For Akses Api</title>
  </head>
  <body class="items-center justify-center h-screen">
    <form
      id="formAksesApi"
      class="bg-stone-150 w-[320px] p-10 rounded-xl shadow-orange-300"
    >
      <div class="text-left">
        <h1 class="text-2xl font-bold">Login Akses API</h1>
      </div>
      <div class="flex flex-col text-left mt-10">
        <div class="flex flex-col gap-5">
          <label for="emailuser">
            <p class="font-semibold text-md">username</p>
            <div class="p-2">
              <input
                id="emailuser"
                type="text"
                placeholder="email / username"
                class="outline-none border-2 p-2 text-xs w-60 rounded-lg font-semibold"
                required
              />
            </div>
          </label>
        </div>
        <div>
          <label for="password">
            <p class="font-semibold text-md">password</p>
            <div class="p-2">
              <input
                id="password"
                type="password"
                placeholder="password"
                class="outline-none border-2 p-2 text-xs w-60 rounded-lg font-semibold"
                required
              />
            </div>
          </label>
        </div>
        <div class="flex justify-center mt-5">
          <button type="submit" class="font-bold" id="btnLogin">Login</button>
        </div>
      </div>
    </form>
    <script src="../../../javascript/validationTokendanLogin.js"></script>
  </body>
</html>
